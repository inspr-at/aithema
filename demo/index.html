<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="frame-src 'none'; child-src 'none'">
<link rel="icon" href="data:,"><title>Aithema</title>
<script src="/demo/theme-init.js"></script><link rel="stylesheet" href="/demo/host.css">
</head><body class="conversation-page"><main class="aithema-shell"><aithema-session>
<h1 class="wordmark" slot="brand">Aithema</h1>
<div class="host-actions" slot="utilities">
<label class="utility utility-language"><span class="utility-icon" id="language-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18"/></svg></span><span id="language-label" class="visually-hidden">Sprache</span><span class="utility-value" id="language-value" aria-hidden="true"></span><select id="locale" aria-labelledby="language-label"><option value="de">DE</option><option value="en">EN</option></select><span class="utility-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></label>
<label class="utility utility-theme"><span class="utility-icon" id="theme-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></span><span id="theme-label" class="visually-hidden">Darstellung</span><span class="theme-value-reserve" aria-hidden="true"><span class="theme-current"><span class="utility-value" id="theme-value"></span><span class="utility-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></span></span><select id="theme" aria-labelledby="theme-label"><option value="light">Hell</option><option value="dark">Dunkel</option><option value="system" selected>System</option></select></label></div>
<span slot="handover-offer" id="demo-handover-offer" data-demo-only hidden></span><span slot="credits-limit" id="demo-credits-limit" data-demo-only hidden></span>
<nav slot="legal" id="demo-legal" aria-label="Legal (demo)" data-demo-only hidden><a id="demo-license" href="https://github.com/inspr-at/aithema/blob/main/LICENSE"></a><a id="demo-legal-source" href="https://github.com/inspr-at/aithema"></a></nav>
<p slot="footer" id="demo-footer" data-demo-only hidden></p></aithema-session><!--aithema-first-paint--></main><div class="host-status"><p id="language-note" role="status"></p><p id="error" role="alert"></p></div><aside class="demo-strip" data-demo-only hidden aria-labelledby="title"><h2 id="title"></h2>
<p id="provider"></p><p id="resume-hint"></p><p id="mock-hint"></p><p id="settings-hint"></p>
<button id="outbox-open" type="button" aria-haspopup="dialog" data-demo-only hidden></button>
<section id="fake-voice" hidden><p id="fake-label"></p><button id="fake-say" type="button"></button><button id="fake-interrupt" type="button"></button><button id="fake-disconnect" type="button"></button></section></aside><footer class="colophon"><a id="source" href="https://github.com/inspr-at/aithema">Quellcode</a><a id="license" href="https://github.com/inspr-at/aithema/blob/main/LICENSE">AGPL-3.0-only</a></footer><dialog id="outbox" aria-labelledby="outbox-title" data-demo-only><h2 id="outbox-title">Demo only: test email outbox</h2><p id="outbox-note"></p><p id="ai-notice"></p><ul id="outbox-list"></ul>
<p id="outbox-status" role="status"></p><button id="outbox-close" type="button">Close</button></dialog>
<script type="module" src="/demo/host.js"></script></body></html>
