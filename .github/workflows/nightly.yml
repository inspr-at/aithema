name: nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-export-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install trash CLI
        run: sudo apt-get update && sudo apt-get install -y trash-cli
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify license surface
        run: npm run verify:license
      - name: Prime consumer packument cache
        env:
          AITHEMA_NPM_CACHE: ${{ runner.temp }}/aithema-npm-cache
          AITHEMA_PRIME_OUT: ${{ runner.temp }}/aithema-consumer-prime
        run: node release/prime-consumer-cache.mjs --build
      - name: Run full suite and recursive source export proof
        env:
          AITHEMA_FULL_EXPORT_PROOF: '1'
          npm_config_cache: ${{ runner.temp }}/aithema-npm-cache
          AITHEMA_NPM_CACHE: ${{ runner.temp }}/aithema-npm-cache
        run: npm test
