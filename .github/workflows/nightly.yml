name: nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  # AIT-192: full Cartesian evidence, including every width pruned from PR CI.
  browser:
    name: full browser (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browser
      - name: Browser runner resources before matrix
        run: |
          free -m
          df -h /dev/shm
          ulimit -a
          ps -eo comm= | sort | uniq -c | sort -nr | head -20
      - name: Full browser matrix with evidence
        run: npm run test:browser -- --shard ${{ matrix.shard }}/8
        env:
          AITHEMA_FULL_MATRIX: '1'
          AITHEMA_EVIDENCE_DIR: ${{ runner.temp }}/evidence
      - name: Browser runner resources after matrix
        if: always()
        run: |
          free -m
          df -h /dev/shm
          ps -eo comm= | sort | uniq -c | sort -nr | head -20
      - name: Retain full matrix test durations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-browser-timings-${{ matrix.shard }}-of-8
          path: ${{ runner.temp }}/evidence/browser-timings
          if-no-files-found: error
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-browser-evidence-${{ matrix.shard }}-of-8
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
