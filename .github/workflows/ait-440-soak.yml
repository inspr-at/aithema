      - name: Complete file 20/20
        run: node --test --test-concurrency=1 test/browser/html-preview.test.js 2>&1 | tee "$RUNNER_TEMP/ait-440-soak/run-20.log"
      - name: Retain complete-file run logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ait-440-complete-file-soak
          path: ${{ runner.temp }}/ait-440-soak
          if-no-files-found: error
          retention-days: 14
