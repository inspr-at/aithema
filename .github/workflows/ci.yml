name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Read the exact shared presentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: inspr-at/inspr
          ref: bd0a13816f728ad91c36d849f88168bcac4fdc6e
          path: .inspr-versioning
          persist-credentials: false
      - name: Reproduce the pinned closure with the upstream bundle CLI
        run: node release/verify-upstream-presentation.mjs .inspr-versioning
      - run: npm run test:browser-shards
      - name: Pack twice and verify without upload
        run: node release/dry-run.mjs
        env:
          AITHEMA_CANONICAL_RELEASE: '1'
      - run: npm test

  browser:
    name: browser (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:browser -- --shard ${{ matrix.shard }}/4
        env:
          AITHEMA_EVIDENCE_DIR: ${{ runner.temp }}/evidence
      # Screenshots the browser suites write, for visual review of UI changes.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-${{ matrix.shard }}-of-4
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 14
